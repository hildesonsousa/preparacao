<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container text-center">
        <form action="login.php" method="post">
            <div class="row p-2 text-center">
                <h1 class="">Acesso ao Sistema</h1>
            </div>
            <div class="row p-2">
                <input type="text" name="login" id="login" placeholder="Digite seu e-mail ou CPF" class="form-control">
            </div>
            <div class="row p-2">
                    <input type="password" name="senha" id="senha" placeholder="Digite sua senha" class="form-control">
            </div>
            <div class="row p-2">
                <input type="submit" name="logar" id="logar" value="Entrar" class="btn btn-success">
                <input type="reset" name="cancelar" id="cancelar" value="Cancelar" class="btn btn-danger mt-2">    
            </div>
            <div class="row">
                <div class="col">
                    <a href="#" class="">Ainda não tenho uma conta</a>
                </div>
                <div class="col">
                    <a href="#" class="">Esqueci minha senha</a>
                </div>
            </div>
        </form>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</html>
